services:
  - type: web
    name: express-mongo-auth-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: BCRYPT_SALT_ROUNDS
        value: 10
